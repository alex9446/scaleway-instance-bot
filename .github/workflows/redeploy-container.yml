name: Redeploy serverless container on Scaleway

on:
  workflow_run:
    workflows: [Deploy docker images to GitHub Container Registry]
    types: [completed]

# Allow one concurrent deployment
concurrency:
  group: 'redeploy'
  cancel-in-progress: true

jobs:
  on-success:
    runs-on: ubuntu-latest
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    environment: redeploy-container
    steps:
      - name: Execute POST request
        env:
          CONTAINER_URL: ${{ secrets.CONTAINER_URL }}
          REDEPLOY_TOKEN: ${{ secrets.REDEPLOY_TOKEN }}
        run: |
          curl -sS --fail-with-body -X POST "$CONTAINER_URL" -H "X-Deploy-Secret-Token: $REDEPLOY_TOKEN"
